services:
  api:
    build: ./backend
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ENVIRONMENT: production
      DEMO_MODE: "false"
      DATABASE_URL: ${SUPABASE_DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-300}
      JWT_SECRET: ${JWT_SECRET}
      PROMPT_HMAC_KEY: ${PROMPT_HMAC_KEY}
      REVIEW_ENCRYPTION_KEY: ${REVIEW_ENCRYPTION_KEY}
      GRANT_ED25519_PRIVATE_KEY: ${GRANT_ED25519_PRIVATE_KEY}
      GRANT_ED25519_PUBLIC_KEY: ${GRANT_ED25519_PUBLIC_KEY}
      OLLAMA_URL: http://ollama:11434
      CORS_ORIGINS: https://${GHST_SERVER_NAME}
      DOWNSTREAM_MODE: real
      DOWNSTREAM_PROVIDER: ${DOWNSTREAM_PROVIDER:-openai_compatible}
      DOWNSTREAM_BASE_URL: ${DOWNSTREAM_BASE_URL}
      DOWNSTREAM_API_KEY: ${DOWNSTREAM_API_KEY}
      DOWNSTREAM_CA_BUNDLE: ${DOWNSTREAM_CA_BUNDLE:-}
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks: [governance_internal, controlled_egress]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${GHST_SERVER_NAME}/api/v1
    read_only: true
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=4m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [governance_internal]

  ollama:
    image: ollama/ollama:0.13.5
    volumes: [ghst_ollama:/root/.ollama]
    networks: [governance_internal]
    # Internal-only network: the local governance model has no Internet route.

  edge:
    image: nginx:1.29-alpine
    ports: ["443:443"]
    environment:
      GHST_SERVER_NAME: ${GHST_SERVER_NAME}
    volumes:
      - ./deploy/production-nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/run/tls:ro
    read_only: true
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=32m", "/var/run:rw,noexec,nosuid,size=4m", "/etc/nginx/conf.d:rw,noexec,nosuid,size=4m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [api, web]
    networks: [governance_internal]

volumes:
  ghst_ollama:

networks:
  governance_internal:
    internal: true
  controlled_egress:
