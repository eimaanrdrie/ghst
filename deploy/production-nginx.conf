events { worker_connections 1024; }

http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=ghst_api:10m rate=20r/s;

  server {
    listen 443 ssl http2;
    server_name ${GHST_SERVER_NAME};

    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
      limit_req zone=ghst_api burst=30 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://api:8000;
    }

    location / {
      proxy_set_header Host $host;
      proxy_pass http://web:80;
    }
  }
}
